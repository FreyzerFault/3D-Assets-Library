name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Run coverage
        run: |
          python -m pip install --upgrade pip coverage
          coverage run -m unittest discover -s tests -v
          coverage report --show-missing

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  validate:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate catalog and report
        run: python generate_assets_data.py --report

      - name: Validate generated artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          assert Path('assets.json').exists(), 'assets.json missing'
          assert Path('assets-report.json').exists(), 'assets-report.json missing'
          print('Catalog and report generated successfully.')
          PY

      - name: Record project metrics
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage
          python scripts/record_metrics.py

      - name: Commit metrics back to repo
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          METRICS_PAT: ${{ secrets.METRICS_PAT }}
        run: |
          if [ -n "$METRICS_PAT" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${METRICS_PAT}@github.com/${GITHUB_REPOSITORY}.git"
            git add docs/metrics_log.md docs/metrics_log.json coverage.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(metrics): refresh project metrics"
              git push origin HEAD:${GITHUB_REF_NAME}
            else
              echo "No metrics changes to commit."
            fi
          else
            echo "METRICS_PAT not configured; skipping automatic metrics commit."
          fi

      - name: Upload metrics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project-metrics
          path: |
            docs/metrics_log.md
            docs/metrics_log.json
            coverage.json

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Biblioteca de 3D Assets de David</title>

    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
    ></script>

    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --bg: #111;
        --panel: #1b1b1b;
        --panel-alt: #151515;
        --border: #292929;
        --text: #eee;
        --muted: #aaa;
        --soft: #777;
        --accent: #7dd3fc;
        --accent-strong: #38bdf8;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      header {
        padding: 50px 40px 30px;
        max-width: 1400px;
        margin: 0 auto;
      }

      header h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 3vw, 2.8rem);
      }

      header p {
        margin: 0;
        color: #999;
        font-size: 1rem;
      }

      #assets {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px 40px 60px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 24px;
      }

      .asset-card {
        overflow: hidden;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .asset-card:hover {
        transform: translateY(-4px);
        border-color: #444;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
      }

      .viewer-container {
        width: 100%;
        aspect-ratio: 1 / 1;
        background: var(--panel-alt);
      }

      model-viewer {
        width: 100%;
        height: 100%;
        display: block;
        background: var(--panel-alt);
        --poster-color: var(--panel-alt);
      }

      .asset-info {
        padding: 18px 20px 20px;
      }

      .asset-name {
        margin: 0 0 8px;
        font-size: 1.25rem;
        font-weight: 600;
      }

      .asset-category {
        display: inline-block;
        margin-bottom: 12px;
        padding: 4px 9px;
        border-radius: 6px;
        background: #292929;
        color: #aaa;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .asset-description {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .download-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 16px;
        padding: 10px 14px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #06212d;
        text-decoration: none;
        font-weight: 700;
        transition: filter 0.2s ease, transform 0.2s ease;
      }

      .download-button:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
      }

      .empty-message {
        grid-column: 1 / -1;
        padding: 60px 20px;
        text-align: center;
        color: var(--soft);
      }

      .load-more {
        grid-column: 1 / -1;
        margin-top: 4px;
        padding: 14px 18px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #1a1a1a;
        color: var(--text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: border-color 0.2s ease, transform 0.2s ease;
      }

      .load-more:hover {
        border-color: #555;
        transform: translateY(-1px);
      }

      .load-more:disabled {
        opacity: 0.6;
        cursor: default;
        transform: none;
      }

      .sentinel {
        grid-column: 1 / -1;
        width: 100%;
        height: 1px;
      }

      @media (max-width: 600px) {
        header {
          padding: 35px 20px 20px;
        }

        #assets {
          padding: 20px;
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Biblioteca de 3D Assets de David</h1>
      <p>Modelos 3D creados por mí.</p>
    </header>

    <main id="assets"></main>

    <script>
      const container = document.getElementById('assets')
      const PAGE_SIZE = 6
      let allAssets = []
      let renderedCount = 0
      let loadMoreButton = null
      let sentinel = null

      const createViewer = (asset) => {
        const model = document.createElement('model-viewer')
        model.dataset.src = asset.file
        model.alt = asset.name
        model.loading = 'lazy'
        model.setAttribute('camera-controls', '')
        model.setAttribute('auto-rotate', '')
        model.setAttribute('shadow-intensity', '1')
        model.setAttribute('touch-action', 'pan-y')
        model.setAttribute('reveal', 'auto')
        model.setAttribute('loading', 'lazy')

        const observer = new IntersectionObserver(
          (entries, currentObserver) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) {
                return
              }

              model.src = model.dataset.src
              currentObserver.unobserve(model)
            })
          },
          {
            rootMargin: '200px 0px',
            threshold: 0.1,
          }
        )

        observer.observe(model)
        return model
      }

      const createCard = (asset) => {
        const card = document.createElement('article')
        card.className = 'asset-card'

        const viewerContainer = document.createElement('div')
        viewerContainer.className = 'viewer-container'

        const model = createViewer(asset)
        viewerContainer.appendChild(model)

        const info = document.createElement('div')
        info.className = 'asset-info'
        info.innerHTML = `
          <h2 class="asset-name">${asset.name}</h2>
          <span class="asset-category">${asset.category}</span>
          <p class="asset-description">${asset.description || 'Sin descripción.'}</p>
          <a class="download-button" href="${asset.file}" download>Descargar GLB</a>
        `

        card.appendChild(viewerContainer)
        card.appendChild(info)
        return card
      }

      const renderNextBatch = () => {
        if (renderedCount >= allAssets.length) {
          if (loadMoreButton) {
            loadMoreButton.disabled = true
            loadMoreButton.textContent = 'No hay más assets'
          }

          return
        }

        const nextAssets = allAssets.slice(renderedCount, renderedCount + PAGE_SIZE)

        nextAssets.forEach((asset) => {
          const card = createCard(asset)
          container.appendChild(card)
        })

        renderedCount += nextAssets.length

        if (loadMoreButton) {
          loadMoreButton.disabled = renderedCount >= allAssets.length
          if (renderedCount >= allAssets.length) {
            loadMoreButton.textContent = 'No hay más assets'
          }
        }
      }

      const attachLoadMore = () => {
        if (loadMoreButton) {
          return
        }

        loadMoreButton = document.createElement('button')
        loadMoreButton.className = 'load-more'
        loadMoreButton.type = 'button'
        loadMoreButton.textContent = 'Cargar más assets'
        loadMoreButton.addEventListener('click', renderNextBatch)
        container.appendChild(loadMoreButton)
      }

      const attachSentinel = () => {
        if (sentinel) {
          return
        }

        sentinel = document.createElement('div')
        sentinel.className = 'sentinel'

        const observer = new IntersectionObserver(
          (entries) => {
            if (entries.some((entry) => entry.isIntersecting)) {
              renderNextBatch()
            }
          },
          {
            rootMargin: '200px 0px',
          }
        )

        observer.observe(sentinel)
        container.appendChild(sentinel)
      }

      fetch('assets.json')
        .then((response) => {
          if (!response.ok) {
            throw new Error('No se pudo cargar assets.json')
          }

          return response.json()
        })
        .then((assets) => {
          if (!Array.isArray(assets) || assets.length === 0) {
            container.innerHTML = '<div class="empty-message">No hay assets todavía.</div>'
            return
          }

          allAssets = assets
          renderNextBatch()
          attachLoadMore()
          attachSentinel()
        })
        .catch((error) => {
          console.error(error)
          container.innerHTML = '<div class="empty-message">Error cargando la biblioteca.</div>'
        })
    </script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Biblioteca de 3D Assets de David</title>

    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
    ></script>

    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --bg: #111;
        --panel: #1b1b1b;
        --panel-alt: #151515;
        --border: #292929;
        --text: #eee;
        --muted: #aaa;
        --soft: #777;
        --accent: #7dd3fc;
        --accent-strong: #38bdf8;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      header {
        padding: 50px 40px 30px;
        max-width: 1400px;
        margin: 0 auto;
      }

      header h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 3vw, 2.8rem);
      }

      header p {
        margin: 0;
        color: #999;
        font-size: 1rem;
      }

      #controls {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 40px 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      #controls input,
      #controls select {
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
      }

      #controls input {
        flex: 1 1 240px;
        min-width: 200px;
      }

      #controls input:focus,
      #controls select:focus {
        outline: none;
        border-color: var(--accent-strong);
      }

      .result-count {
        color: var(--soft);
        font-size: 0.85rem;
      }

      #assets {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px 40px 60px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 24px;
      }

      .asset-card {
        overflow: hidden;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .asset-card:hover {
        transform: translateY(-4px);
        border-color: #444;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
      }

      .viewer-container {
        width: 100%;
        aspect-ratio: 1 / 1;
        background: var(--panel-alt);
      }

      model-viewer {
        width: 100%;
        height: 100%;
        display: block;
        background: var(--panel-alt);
        --poster-color: var(--panel-alt);
      }

      .asset-info {
        padding: 18px 20px 20px;
      }

      .asset-name {
        margin: 0 0 8px;
        font-size: 1.25rem;
        font-weight: 600;
      }

      .asset-category {
        display: inline-block;
        margin-bottom: 12px;
        padding: 4px 9px;
        border-radius: 6px;
        background: #292929;
        color: #aaa;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .asset-description {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .download-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 16px;
        padding: 10px 14px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #06212d;
        text-decoration: none;
        font-weight: 700;
        transition: filter 0.2s ease, transform 0.2s ease;
      }

      .download-button:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
      }

      .empty-message {
        grid-column: 1 / -1;
        padding: 60px 20px;
        text-align: center;
        color: var(--soft);
      }

      .load-more {
        grid-column: 1 / -1;
        margin-top: 4px;
        padding: 14px 18px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #1a1a1a;
        color: var(--text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: border-color 0.2s ease, transform 0.2s ease;
      }

      .load-more:hover {
        border-color: #555;
        transform: translateY(-1px);
      }

      .load-more:disabled {
        opacity: 0.6;
        cursor: default;
        transform: none;
      }

      .sentinel {
        grid-column: 1 / -1;
        width: 100%;
        height: 1px;
      }

      @media (max-width: 600px) {
        header {
          padding: 35px 20px 20px;
        }

        #controls {
          padding: 0 20px 10px;
        }

        #assets {
          padding: 20px;
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Biblioteca de 3D Assets de David</h1>
      <p>Modelos 3D creados por mí.</p>
    </header>

    <section id="controls">
      <input id="search-input" type="search" placeholder="Buscar por nombre…" autocomplete="off" />
      <select id="category-filter">
        <option value="">Todas las categorías</option>
      </select>
      <span id="result-count" class="result-count" hidden></span>
    </section>

    <main id="assets"></main>

    <script>
      const container = document.getElementById('assets')
      const searchInput = document.getElementById('search-input')
      const categoryFilter = document.getElementById('category-filter')
      const resultCount = document.getElementById('result-count')
      const PAGE_SIZE = 6
      let allAssets = []
      let filteredAssets = []
      let renderedCount = 0
      let loadMoreButton = null
      let sentinel = null

      const normalizeText = (value) =>
        String(value || '')
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')

      const appendCard = (card) => {
        if (loadMoreButton) {
          container.insertBefore(card, loadMoreButton)
          return
        }

        container.appendChild(card)
      }

      const clearEmptyMessage = () => {
        const message = container.querySelector('.empty-message')
        if (message) {
          message.remove()
        }
      }

      const showEmptyMessage = (text) => {
        let message = container.querySelector('.empty-message')

        if (!message) {
          message = document.createElement('div')
          message.className = 'empty-message'

          if (loadMoreButton) {
            container.insertBefore(message, loadMoreButton)
          } else {
            container.appendChild(message)
          }
        }

        message.textContent = text
      }

      const populateCategoryFilter = () => {
        const categories = [
          ...new Set(allAssets.map((asset) => asset.category).filter(Boolean)),
        ].sort((a, b) => a.localeCompare(b, 'es'))

        categories.forEach((category) => {
          const option = document.createElement('option')
          option.value = category
          option.textContent = category
          categoryFilter.appendChild(option)
        })
      }

      const updateLoadMoreState = () => {
        if (!loadMoreButton) {
          return
        }

        const exhausted = renderedCount >= filteredAssets.length
        loadMoreButton.disabled = exhausted
        loadMoreButton.textContent = exhausted ? 'No hay más assets' : 'Cargar más assets'
      }

      const updateResultCount = () => {
        resultCount.textContent = `${filteredAssets.length} de ${allAssets.length} assets`
        resultCount.hidden = false
      }

      const resetRenderedAssets = () => {
        renderedCount = 0
        container.querySelectorAll('.asset-card').forEach((card) => card.remove())
        clearEmptyMessage()
      }

      const applyFilters = () => {
        const query = normalizeText(searchInput.value.trim())
        const category = categoryFilter.value

        filteredAssets = allAssets.filter((asset) => {
          const matchesQuery = !query || normalizeText(asset.name).includes(query)
          const matchesCategory = !category || asset.category === category
          return matchesQuery && matchesCategory
        })

        resetRenderedAssets()
        renderNextBatch()
        updateResultCount()
      }

      searchInput.addEventListener('input', applyFilters)
      categoryFilter.addEventListener('change', applyFilters)

      const createViewer = (asset) => {
        const model = document.createElement('model-viewer')
        model.dataset.src = asset.file
        model.alt = asset.name
        model.loading = 'lazy'
        model.setAttribute('camera-controls', '')
        model.setAttribute('auto-rotate', '')
        model.setAttribute('shadow-intensity', '1')
        model.setAttribute('touch-action', 'pan-y')
        model.setAttribute('reveal', 'auto')
        model.setAttribute('loading', 'lazy')

        const observer = new IntersectionObserver(
          (entries, currentObserver) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) {
                return
              }

              model.src = model.dataset.src
              currentObserver.unobserve(model)
            })
          },
          {
            rootMargin: '200px 0px',
            threshold: 0.1,
          }
        )

        observer.observe(model)
        return model
      }

      const createCard = (asset) => {
        const card = document.createElement('article')
        card.className = 'asset-card'

        const viewerContainer = document.createElement('div')
        viewerContainer.className = 'viewer-container'

        const model = createViewer(asset)
        viewerContainer.appendChild(model)

        const info = document.createElement('div')
        info.className = 'asset-info'
        info.innerHTML = `
          <h2 class="asset-name">${asset.name}</h2>
          <span class="asset-category">${asset.category}</span>
          <p class="asset-description">${asset.description || 'Sin descripción.'}</p>
          <a class="download-button" href="${asset.file}" download>Descargar GLB</a>
        `

        card.appendChild(viewerContainer)
        card.appendChild(info)
        return card
      }

      const renderNextBatch = () => {
        if (renderedCount >= filteredAssets.length) {
          updateLoadMoreState()

          if (filteredAssets.length === 0) {
            showEmptyMessage('No hay assets que coincidan con la búsqueda.')
          }

          return
        }

        clearEmptyMessage()

        const nextAssets = filteredAssets.slice(renderedCount, renderedCount + PAGE_SIZE)

        nextAssets.forEach((asset) => {
          appendCard(createCard(asset))
        })

        renderedCount += nextAssets.length
        updateLoadMoreState()
      }

      const attachLoadMore = () => {
        if (loadMoreButton) {
          return
        }

        loadMoreButton = document.createElement('button')
        loadMoreButton.className = 'load-more'
        loadMoreButton.type = 'button'
        loadMoreButton.textContent = 'Cargar más assets'
        loadMoreButton.addEventListener('click', renderNextBatch)
        container.appendChild(loadMoreButton)
      }

      const attachSentinel = () => {
        if (sentinel) {
          return
        }

        sentinel = document.createElement('div')
        sentinel.className = 'sentinel'

        const observer = new IntersectionObserver(
          (entries) => {
            if (entries.some((entry) => entry.isIntersecting)) {
              renderNextBatch()
            }
          },
          {
            rootMargin: '200px 0px',
          }
        )

        observer.observe(sentinel)
        container.appendChild(sentinel)
      }

      fetch('assets.json')
        .then((response) => {
          if (!response.ok) {
            throw new Error('No se pudo cargar assets.json')
          }

          return response.json()
        })
        .then((assets) => {
          if (!Array.isArray(assets) || assets.length === 0) {
            container.innerHTML = '<div class="empty-message">No hay assets todavía.</div>'
            return
          }

          allAssets = assets
          populateCategoryFilter()
          applyFilters()
          attachLoadMore()
          attachSentinel()
          updateLoadMoreState()
        })
        .catch((error) => {
          console.error(error)
          container.innerHTML = '<div class="empty-message">Error cargando la biblioteca.</div>'
        })
    </script>
  </body>
</html>
